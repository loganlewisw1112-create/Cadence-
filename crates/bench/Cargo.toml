[package]
name = "bench"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bench"
path = "src/main.rs"

[[bin]]
name = "persist_bench"
path = "src/persist_bench.rs"


[dependencies]
bus = { path = "../bus" }
message-core = { path = "../message-core" }
quanta = "0.12"
hdrhistogram = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
core_affinity = "0.8"
persist = { path = "../persist" }
